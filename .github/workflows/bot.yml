name: paper-bot

# Runs the paper-trading bot on a timer and commits what it recorded to data/.
# GitHub's scheduler is best-effort: runs can start several minutes late.
on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Clone
        run: |
          git clone --quiet --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo

      - name: Run one bot cycle
        working-directory: repo
        run: python3 -m bot.run

      - name: Commit data
        working-directory: repo
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit --quiet -m "bot: run $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git pull --quiet --rebase origin "$BRANCH" && git push --quiet origin "HEAD:$BRANCH"; then
              exit 0
            fi
            sleep 5
          done
          echo "push failed after 3 attempts"; exit 1
