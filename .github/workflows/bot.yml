name: paper-bot

# One short run = one bot cycle (about a minute), then it commits data/ and exits.
#
# What starts a run:
#   - an external scheduler calling GitHub's "run workflow" API every 5 minutes (reliable)
#   - GitHub's own timer below (best-effort: often late, sometimes skipped)
#   - the "Run workflow" button, or a push that changes the .kick file
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".kick"]

permissions:
  contents: write

# Never two runs at once: a second one waits for the first to finish.
concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BRANCH: main
    steps:
      - name: Clone
        run: |
          git clone --quiet --depth 1 --branch "$BRANCH" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repo

      - name: Run one bot cycle
        working-directory: repo
        run: python3 -m bot.run

      - name: Commit data
        working-directory: repo
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit --quiet -m "bot: run $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git pull --quiet --rebase origin "$BRANCH" && git push --quiet origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "push failed after 3 attempts"; exit 1
